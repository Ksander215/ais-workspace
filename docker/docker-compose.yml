version: '3.8'

services:
  frontend:
    build:
      context: ../landing
      dockerfile: ../docker/Dockerfile.frontend
    ports:
      # the image runs nginx on port 80
      - "3000:80"
    restart: unless-stopped

  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    ports:
      - "3001:3001"
    volumes:
      - sip-data:/var/lib/sip
    environment:
      # the server reads SIP_PORT, not PORT
      - SIP_PORT=3001
      - NODE_ENV=production
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      # TLS is off by default: it needs certificates, see backend/nginx-sip-ssl.conf
      # - "443:443"
    volumes:
      - ../backend/nginx-sip.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-data:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  # Uncomment after the certificates are issued:
  # certbot:
  #   image: certbot/certbot
  #   volumes:
  #     - certbot-data:/etc/letsencrypt
  #     - certbot-www:/var/www/certbot

volumes:
  sip-data:
  certbot-data:
