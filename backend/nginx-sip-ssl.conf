# SIP — TLS configuration for sec-scanner.pro
#
# Enable it only AFTER the certificates exist:
#   docker compose run --rm certbot certonly --webroot -w /var/www/certbot \
#     -d sec-scanner.pro -d www.sec-scanner.pro
# and then mount this file into the nginx container:
#   ./backend/nginx-sip-ssl.conf:/etc/nginx/conf.d/ssl.conf:ro
#
# Without certificates nginx refuses to start ("cannot load certificate"),
# which is why this file is not mounted by default.

server {
    listen 443 ssl;
    http2 on;
    server_name sec-scanner.pro www.sec-scanner.pro;

    ssl_certificate     /etc/letsencrypt/live/sec-scanner.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sec-scanner.pro/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    location /api/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;
        proxy_cache off;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name sec-scanner.pro www.sec-scanner.pro;
    return 301 https://$host$request_uri;
}
