# SIP — nginx configuration for sec-scanner.pro
# Static frontend (Next.js export) served by the `frontend` container,
# API proxied to the `backend` container.

server {
    listen 80;
    server_name sec-scanner.pro www.sec-scanner.pro;

    # ─── API proxy → Backend container ───────────────────────────────────
    # The backend runs in its own container: 127.0.0.1 would point at nginx.
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # SSE support — disable buffering
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # ─── Static frontend → frontend container ─────────────────────────────
    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ─── HTTPS ────────────────────────────────────────────────────────────────
# TLS is enabled in nginx-sip-ssl.conf, which requires certificates issued by
# certbot. Mount it into /etc/nginx/conf.d/ only after the certificates exist
# (e.g. `docker compose run --rm certbot certonly ...`); otherwise nginx fails
# to start with "cannot load certificate".
