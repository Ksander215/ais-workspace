name: Apply AIS claim statement patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode patch
        run: |
          base64 -d aisllm4.b64 > ais-llm4.patch.gz
          gzip -dc ais-llm4.patch.gz > ais-llm4.patch
      - name: Apply patch
        run: git apply ais-llm4.patch
      - name: Commit
        run: |
          git config user.name Ksander215
          git config user.email ksander215@users.noreply.github.com
          git add -A
          git commit -m "fix(ais): make claims state what the answer says about the source"
          git push origin HEAD:main
      - name: Cleanup
        run: rm -f aisllm4.b64 ais-llm4.patch.gz ais-llm4.patch
