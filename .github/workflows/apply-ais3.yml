name: Apply AIS fix-cycle patch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Decode patch
        run: |
          cat ais3.b64.part* > ais3.b64
          base64 -d ais3.b64 > ais3.patch.gz
          gunzip -f ais3.patch.gz
          wc -l ais3.patch

      - name: Apply patch
        run: |
          if git apply --check --whitespace=nowarn ais3.patch; then
            git apply --whitespace=nowarn ais3.patch
            echo "PATCH_APPLIED"
          else
            echo "PATCH_ALREADY_APPLIED_OR_INCOMPATIBLE"
            git apply --reject --whitespace=nowarn ais3.patch || true
          fi
          git status --short

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "no changes"; else
            git commit -m "fix(ais): honest claim semantics, package-accurate module map, symlink-safe file count and wider fallback scan"
            git push origin HEAD:main
          fi

      - name: Cleanup temporary files
        run: |
          rm -f ais3.b64 ais3.b64.part* ais3.patch ais3.patch.gz .github/workflows/apply-ais3.yml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: remove temporary AIS patch bootstrap files"
            git push origin HEAD:main
          fi
