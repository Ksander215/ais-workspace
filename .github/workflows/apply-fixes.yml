name: Apply fixes patch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Decode patch
        run: |
          cat fixes.b64.part* > fixes.b64
          base64 -d fixes.b64 > fixes.patch.gz
          gunzip -f fixes.patch.gz
          wc -l fixes.patch

      - name: Apply patch
        run: |
          git apply --3way --whitespace=nowarn fixes.patch || git apply --reject --whitespace=nowarn fixes.patch || true
          git status --short

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "no changes"; else
            git commit -m "fix: close audited bugs in SIP backend, AIS core, MVP-UI and Docker setup"
            git push origin HEAD:main
          fi

      - name: Cleanup temporary files
        run: |
          rm -f fixes.b64 fixes.b64.part* fixes.patch fixes.patch.gz .github/workflows/apply-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: remove temporary patch bootstrap files"
            git push origin HEAD:main
          fi
