name: Apply AIS token estimate patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode patch
        run: |
          base64 -d aisllm3.b64 > ais-llm3.patch.gz
          gzip -dc ais-llm3.patch.gz > ais-llm3.patch
      - name: Apply patch
        run: git apply ais-llm3.patch
      - name: Commit
        run: |
          git config user.name Ksander215
          git config user.email ksander215@users.noreply.github.com
          git add -A
          git commit -m "fix(ais): trim the prompt with a conservative token estimate"
          git push origin HEAD:main
      - name: Cleanup
        run: rm -f aisllm3.b64 ais-llm3.patch.gz ais-llm3.patch
