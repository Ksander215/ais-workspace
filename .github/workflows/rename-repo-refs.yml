name: Rename Repo References

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    name: Rewrite sec-scanner-workspace references
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rename references
        run: python3 scripts/rename_repo_refs.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to rename"
            exit 0
          fi
          git commit -m "refactor: rename repository references to ais-workspace"
          git push origin HEAD:main
