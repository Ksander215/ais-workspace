name: Apply AIS evidence/context alignment patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode patch
        run: |
          base64 -d aisllm2.b64 > ais-llm2.patch.gz
          gzip -dc ais-llm2.patch.gz > ais-llm2.patch
      - name: Apply patch
        run: git apply ais-llm2.patch
      - name: Commit
        run: |
          git config user.name Ksander215
          git config user.email ksander215@users.noreply.github.com
          git add -A
          git commit -m "fix(ais): cite the same files in the answer context and in its evidence"
          git push origin HEAD:main
      - name: Cleanup
        run: rm -f aisllm2.b64 ais-llm2.patch.gz ais-llm2.patch
