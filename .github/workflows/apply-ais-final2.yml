name: Apply AIS discovery patch v2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        run: |
          base64 -d aisfinal2.b64 > /tmp/p.gz
          gzip -dc /tmp/p.gz > /tmp/p.patch
          git apply /tmp/p.patch
          git config user.name "ais-bot"
          git config user.email "ais-bot@local"
          git add -A
          git commit -m "fix(ais): see the whole repository and ground claims in what was shown" || true
          git push origin main
      - name: Cleanup
        if: always()
        run: |
          git config user.name "ais-bot"
          git config user.email "ais-bot@local"
          git rm -q --cached aisfinal2.b64 || true
          rm -f aisfinal2.b64
          git rm -q --cached .github/workflows/apply-ais-final2.yml || true
          rm -f .github/workflows/apply-ais-final2.yml
          git add -A
          git commit -m "chore: remove temporary patch payload" || true
          git push origin main
