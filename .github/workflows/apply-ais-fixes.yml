name: Apply AIS fixes patch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Decode patch
        run: |
          cat ais2.b64.part* > ais2.b64
          base64 -d ais2.b64 > ais2.patch.gz
          gunzip -f ais2.patch.gz
          wc -l ais2.patch

      - name: Apply patch
        run: |
          git apply --3way --whitespace=nowarn ais2.patch || git apply --reject --whitespace=nowarn ais2.patch || true
          git status --short

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "no changes"; else
            git commit -m "fix(ais): platform-aware path security, pinned-commit import and code-derived fallback analysis"
            git push origin HEAD:main
          fi

      - name: Cleanup temporary files
        run: |
          rm -f ais2.b64 ais2.b64.part* ais2.patch ais2.patch.gz .github/workflows/apply-ais-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: remove temporary patch bootstrap files"
            git push origin HEAD:main
          fi
