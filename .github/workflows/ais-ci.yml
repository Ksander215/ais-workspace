name: AIS CI

on:
  push:
    branches: ["main", "fix/**", "feature/**", "test/**", "chore/**", "docs/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  ais:
    name: Build and test AIS
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Tests
        run: npm test

      - name: MVP UI tests
        run: npm run test:mvp-ui
