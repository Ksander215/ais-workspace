name: Apply AIS real-inference fix patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode patch
        run: |
          base64 -d aisllm.b64 > ais-llm.patch.gz
          gzip -dc ais-llm.patch.gz > ais-llm.patch
      - name: Apply patch
        run: git apply ais-llm.patch
      - name: Commit
        run: |
          git config user.name Ksander215
          git config user.email ksander215@users.noreply.github.com
          git add -A
          git commit -m "fix(ais): route real questions to the model instead of clarification stubs"
          git push origin HEAD:main
      - name: Cleanup
        run: rm -f aisllm.b64 ais-llm.patch.gz ais-llm.patch
