name: apply-ais-readme-patch
on:
  push:
    branches: [main]
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: |
          cat aisfix/readme.patch.gz.part00 aisfix/readme.patch.gz.part01 aisfix/readme.patch.gz.part02 > /tmp/p.b64
          base64 -d /tmp/p.b64 > /tmp/p.patch.gz
          gzip -d /tmp/p.patch.gz > /tmp/p.patch
          git apply --check /tmp/p.patch && git apply /tmp/p.patch
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(ais): publish exact README and optimizer rounding fix" || exit 0
          git push
      - name: Cleanup
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rm -f aisfix/readme.patch.gz.part0*
          git add -A
          git commit -m "chore: remove temporary patch bootstrap files" || exit 0
          git push
